name: Proxy Scraper Auto Update

env:
  PROJECT_AUTHOR: Gametturxux
  PROJECT_COMMUNITY: gametturxux community
  PROJECT_REPOSITORY: Proxy-List-Gamt
  COMMUNITY_CHANNEL: https://whatsapp.com/channel/0029VbC6a5C7oQhUeajM3q1i

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      timeout:
        description: "Per-probe timeout in seconds"
        required: false
        default: "8"
      concurrency:
        description: "Simultaneous protocol probes"
        required: false
        default: "800"
      tcp_concurrency:
        description: "Simultaneous TCP pre-filter connects"
        required: false
        default: "3000"
      rounds:
        description: "Confirmation rounds after the first pass"
        required: false
        default: "2"
      time_budget:
        description: "Stop verifying after N minutes (0 = no limit)"
        required: false
        default: "70"
      max_candidates:
        description: "Test only the best N candidates (0 = all)"
        required: false
        default: "0"
      discover:
        description: "Find new proxy-list repositories on GitHub (auto/on/off)"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: proxy-scraper-auto-update
  cancel-in-progress: false

jobs:
  authorization:
    name: Author lock
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        name: Verify repository identity
        run: |
          echo "author        : ${PROJECT_AUTHOR}"
          echo "community     : ${PROJECT_COMMUNITY}"
          echo "expected repo : ${PROJECT_REPOSITORY}"
          echo "current repo  : ${{ github.event.repository.name }}"
          if [ "${{ github.event.repository.name }}" != "${PROJECT_REPOSITORY}" ]; then
            echo "::error title=Author lock::Repository must stay named ${PROJECT_REPOSITORY}. Automation is disabled after a rename."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  update:
    name: Scrape and validate
    needs: authorization
    if: needs.authorization.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Remembers which sources keep failing so they are skipped (and finally pruned
      # from sources/discovered.txt) instead of being downloaded every three hours.
      - name: Restore source health
        uses: actions/cache@v4
        with:
          path: .cache/source_health.json
          key: source-health-${{ github.run_id }}
          restore-keys: |
            source-health-

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -n 65535 || true
          python main.py \
            --timeout "${{ github.event.inputs.timeout || '8' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '800' }}" \
            --tcp-concurrency "${{ github.event.inputs.tcp_concurrency || '3000' }}" \
            --rounds "${{ github.event.inputs.rounds || '2' }}" \
            --time-budget "${{ github.event.inputs.time_budget || '70' }}" \
            --max-candidates "${{ github.event.inputs.max_candidates || '0' }}" \
            --discover "${{ github.event.inputs.discover || 'auto' }}"

      - name: Build summary
        run: |
          {
            echo "### ${PROJECT_REPOSITORY}"
            echo ""
            echo "Author: ${PROJECT_AUTHOR} | ${PROJECT_COMMUNITY}"
            echo ""
            echo "Channel: ${COMMUNITY_CHANNEL}"
            echo ""
            echo '```json'
            cat results/json/stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "${PROJECT_AUTHOR} bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results sources README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          COUNT=$(python -c "import json;print(json.load(open('results/json/stats.json'))['live'])")
          git commit -m "update: ${COUNT} live proxies [${PROJECT_AUTHOR}]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
