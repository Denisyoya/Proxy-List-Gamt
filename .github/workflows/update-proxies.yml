name: Proxy Scraper Auto Update

env:
  PROJECT_AUTHOR: Gametturxux
  PROJECT_COMMUNITY: gametturxux community
  PROJECT_REPOSITORY: Proxy-List-Gamt
  COMMUNITY_CHANNEL: https://whatsapp.com/channel/0029VbC6a5C7oQhUeajM3q1i

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      timeout:
        description: "Per-request timeout in seconds"
        required: false
        default: "8"
      concurrency:
        description: "Parallel checks during validation"
        required: false
        default: "1500"
      rounds:
        description: "Confirmation rounds"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: proxy-scraper-auto-update
  cancel-in-progress: false

jobs:
  authorization:
    name: Author lock
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        name: Verify repository identity
        run: |
          echo "author        : ${PROJECT_AUTHOR}"
          echo "community     : ${PROJECT_COMMUNITY}"
          echo "expected repo : ${PROJECT_REPOSITORY}"
          echo "current repo  : ${{ github.event.repository.name }}"
          if [ "${{ github.event.repository.name }}" != "${PROJECT_REPOSITORY}" ]; then
            echo "::error title=Author lock::Repository must stay named ${PROJECT_REPOSITORY}. Automation is disabled after a rename."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  update:
    name: Scrape and validate
    needs: authorization
    if: needs.authorization.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          ulimit -n 65535 || true
          python main.py \
            --timeout "${{ github.event.inputs.timeout || '8' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '1500' }}" \
            --rounds "${{ github.event.inputs.rounds || '2' }}"

      - name: Build summary
        run: |
          {
            echo "### ${PROJECT_REPOSITORY}"
            echo ""
            echo "Author: ${PROJECT_AUTHOR} | ${PROJECT_COMMUNITY}"
            echo ""
            echo "Channel: ${COMMUNITY_CHANNEL}"
            echo ""
            echo '```json'
            cat proxy/stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "${PROJECT_AUTHOR} bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy sources.txt README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          COUNT=$(python -c "import json;print(json.load(open('proxy/stats.json'))['live'])")
          git commit -m "update: ${COUNT} live proxies [${PROJECT_AUTHOR}]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
